<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>现场演示目录</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.88);
      --panel-soft: rgba(30, 41, 59, 0.82);
      --line: rgba(148, 163, 184, 0.2);
      --text: #e2e8f0;
      --text-soft: #94a3b8;
      --accent: #38bdf8;
      --accent-strong: #0ea5e9;
      --accent-soft: rgba(56, 189, 248, 0.16);
      --danger: #ef4444;
      --shadow: 0 20px 45px rgba(15, 23, 42, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(56, 189, 248, 0.12), transparent 28%),
        radial-gradient(circle at bottom left, rgba(14, 165, 233, 0.12), transparent 24%),
        var(--bg);
    }

    .app {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100vh;
      padding: 16px 14px;
      border-right: 1px solid var(--line);
      background: rgba(2, 6, 23, 0.72);
      backdrop-filter: blur(16px);
      overflow: hidden;
    }

    .content {
      height: 100vh;
      padding: 10px 10px 10px 0;
      overflow: hidden;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .sidebar-header {
      margin-bottom: 4px;
    }

    .sidebar-header h1 {
      font-size: 22px;
      margin-bottom: 0;
    }

    .sidebar-header p,
    .hint,
    .meta-line {
      color: var(--text-soft);
      line-height: 1.6;
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }

    button,
    .item-button {
      border: 1px solid transparent;
      border-radius: 14px;
      background: var(--panel-soft);
      color: var(--text);
      cursor: pointer;
      transition: 0.2s ease;
    }

    button {
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.2;
    }

    .toolbar > button {
      flex: 0 0 auto;
      min-width: 0;
      white-space: nowrap;
    }

    #settingsBtn {
      width: 28px;
      height: 28px;
      padding: 0;
      font-size: 14px;
      line-height: 1;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.28);
    }

    #fullscreenBtn {
      width: 28px;
      height: 28px;
      padding: 0;
      font-size: 14px;
      line-height: 1;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.18);
      margin-right: 6px;
    }

    button:hover,
    .item-button:hover {
      border-color: rgba(56, 189, 248, 0.35);
      transform: translateY(-1px);
    }

    .primary {
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.9), rgba(37, 99, 235, 0.9));
    }

    .danger {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.24);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 14px;
      background: var(--panel-soft);
    }

    .toggle-row span {
      font-size: 12px;
      line-height: 1.35;
    }

    .toggle-row input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .toolbar-note {
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.42);
      border: 1px solid rgba(148, 163, 184, 0.14);
      color: var(--text-soft);
      font-size: 12px;
      line-height: 1.6;
    }

    .settings-modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(2, 6, 23, 0.58);
      backdrop-filter: blur(4px);
      z-index: 20;
      padding: 18px;
    }

    .settings-modal.open {
      display: grid;
    }

    .settings-panel {
      width: min(480px, 100%);
      display: grid;
      gap: 10px;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(2, 6, 23, 0.96);
      box-shadow: var(--shadow);
    }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .settings-header h3 {
      font-size: 14px;
    }

    .settings-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .filter-actions {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .filter-btn.active-filter {
      border-color: rgba(56, 189, 248, 0.48);
      background: rgba(14, 165, 233, 0.2);
    }

    .settings-close {
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 10px;
    }

    .catalog {
      flex: 1;
      min-height: 0;
      display: grid;
      gap: 10px;
      overflow-y: auto;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
      padding-right: 2px;
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.55) transparent;
    }

    .catalog::-webkit-scrollbar {
      width: 6px;
    }

    .catalog::-webkit-scrollbar-track {
      background: transparent;
    }

    .catalog::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.55);
      border-radius: 999px;
    }

    .catalog::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.72);
    }

    .section {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .section-heading {
      display: grid;
      gap: 4px;
    }

    .section-header h3 {
      font-size: 16px;
    }

    .section-subtitle {
      font-size: 12px;
      color: var(--text-soft);
      line-height: 1.5;
    }

    .section-count {
      min-width: 28px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #bae6fd;
      text-align: center;
      font-size: 12px;
    }

    .item-list {
      display: grid;
      gap: 8px;
    }

    .item-button {
      width: 100%;
      padding: 10px;
      text-align: left;
    }

    .item-button.highlighted {
      position: relative;
      border-color: rgba(250, 204, 21, 0.36);
      background:
        linear-gradient(135deg, rgba(250, 204, 21, 0.14), rgba(245, 158, 11, 0.08)),
        rgba(30, 41, 59, 0.9);
      box-shadow: 0 12px 24px rgba(245, 158, 11, 0.12);
    }

    .item-button.active {
      background: rgba(14, 165, 233, 0.2);
      border-color: rgba(56, 189, 248, 0.48);
    }

    .item-button.highlighted.active {
      background:
        linear-gradient(135deg, rgba(250, 204, 21, 0.18), rgba(14, 165, 233, 0.18)),
        rgba(14, 165, 233, 0.22);
      border-color: rgba(250, 204, 21, 0.5);
    }

    .item-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .item-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }

    .item-badge {
      flex: 0 0 auto;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(250, 204, 21, 0.18);
      color: #fde68a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .item-meta {
      font-size: 12px;
      color: var(--text-soft);
      word-break: break-all;
    }

    .player-panel {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      height: calc(100vh - 20px);
      padding: 12px;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: rgba(2, 6, 23, 0.56);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      padding: 2px 2px 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      margin-bottom: 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: var(--accent-soft);
      color: #bae6fd;
      text-transform: uppercase;
    }

    .player-header h2 {
      font-size: 24px;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .player-controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(96px, 1fr));
      gap: 8px;
      width: min(280px, 100%);
    }

    .player-controls button {
      padding: 7px 8px;
      font-size: 11px;
      border-radius: 12px;
    }

    .stage {
      position: relative;
      height: calc(100vh - 16px);
      min-height: calc(100vh - 16px);
      padding: 0;
      border-radius: 24px;
      background: #020617;
      border: 1px solid rgba(148, 163, 184, 0.14);
      overflow: hidden;
    }

    video,
    img,
    .placeholder {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      display: none;
      background: #020617;
    }

    video,
    img {
      object-fit: contain;
    }

    .placeholder {
      display: grid;
      place-items: center;
      padding: 30px;
      text-align: center;
      color: var(--text);
      background:
        linear-gradient(135deg, rgba(14, 165, 233, 0.14), rgba(37, 99, 235, 0.14)),
        rgba(15, 23, 42, 0.9);
      border: 1px dashed rgba(56, 189, 248, 0.35);
    }

    .placeholder-box {
      max-width: 520px;
    }

    .placeholder-box h3 {
      margin-bottom: 10px;
      font-size: 26px;
    }

    .placeholder-box p {
      color: #cbd5e1;
      line-height: 1.7;
    }

    .player-footer {
      display: none;
    }

    .settings-status {
      display: grid;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.54);
      border: 1px solid rgba(148, 163, 184, 0.12);
    }

    .settings-status-row {
      color: var(--text-soft);
      font-size: 12px;
      line-height: 1.6;
      word-break: break-word;
    }

    .settings-status-row strong {
      color: #e0f2fe;
    }

    
    .player-header,
    .player-footer {
      display: none !important;
    }

    .content .player-panel {
      height: 100%;
    }


    .floating-controls {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 4;
      display: flex;
      gap: 8px;
      padding: 8px;
      border-radius: 16px;
      background: rgba(2, 6, 23, 0.18);
      backdrop-filter: blur(10px);
    }

    .floating-controls button {
      min-width: 72px;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.14);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 700;
    }

    .floating-controls button:hover {
      border-color: rgba(56, 189, 248, 0.36);
      background: rgba(15, 23, 42, 0.76);
    }


    @media (max-width: 1080px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        height: auto;
      }

      .player-header {
        flex-direction: column;
      }

      .player-controls {
        width: 100%;
      }

      .content {
        padding: 10px;
      }

      .player-panel {
        height: auto;
        min-height: calc(100vh - 220px);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>现场演示目录</h1>
      </div>

      <div class="catalog" id="catalog"></div>

      <div class="toolbar">
        <button id="fullscreenBtn" aria-label="全屏" title="全屏">⛶</button>
        <button id="settingsBtn" aria-label="打开设置" title="打开设置">⚙</button>
      </div>
    </aside>

    <main class="content">
      <section class="player-panel">
        <div class="player-header">
          <div>
            <div class="badge" id="mediaBadge">待选择</div>
            <h2 id="mediaTitle">请选择左侧目录项</h2>
            <p class="meta-line" id="mediaPath">当前尚未打开任何视频或图片。</p>
          </div>

          
        </div>

        <div class="stage">
          <div class="floating-controls">
            <button id="prevBtn">上一个</button>
            <button id="nextBtn">下一个</button>
            <button id="replayBtn">重播</button>
            <button id="openCurrentSectionBtn">轮播</button>
          </div>
          <video id="videoPlayer" controls playsinline preload="auto"></video>
          <img id="imagePlayer" alt="图片预览">
          <div id="placeholderPlayer" class="placeholder">
            <div class="placeholder-box">
              <h3 id="placeholderTitle">待补充素材</h3>
              <p id="placeholderDesc">左侧空目录已经自动生成占位项，后续素材上传完成后可直接替换为真实文件。</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="settingsModal" class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="settings-panel">
      <div class="settings-header">
        <h3 id="settingsTitle">设置</h3>
        <button id="closeSettingsBtn" class="settings-close" aria-label="关闭设置">×</button>
      </div>
      <div class="settings-actions">
        <button id="playSectionBtn" class="primary">轮播当前目录</button>
        <button id="playBoothBtn">同展台轮播</button>
        <button id="playMetricsBtn">按指标顺序轮播</button>
        <button id="playAllBtn">全素材轮播</button>
        <button id="stopBtn" class="danger">停止轮播</button>
      </div>
      <button id="scanBtn">选择本地目录</button>
      <label class="toggle-row">
        <input id="sourceModeToggle" type="checkbox">
        <span id="sourceModeLabel">使用云端视频</span>
      </label>
      <label class="toggle-row">
        <input id="loopToggle" type="checkbox" checked>
        <span>轮播结束后自动从头继续</span>
      </label>
      <label class="toggle-row">
        <input id="centerActiveToggle" type="checkbox" checked>
        <span>切换视频时将当前条目尽量滚动到列表中间</span>
      </label>
      <div class="settings-actions filter-actions">
        <button id="filterAllBtn" class="filter-btn active-filter">显示全部条目</button>
        <button id="filterBoothBtn" class="filter-btn">仅显示当前展台条目</button>
        <button id="filterMetricBtn" class="filter-btn">仅显示当前指标条目</button>
      </div>
      <div class="settings-status">
        <div id="modeInfo" class="settings-status-row"><strong>当前模式：</strong>单项预览</div>
        <div id="queueInfo" class="settings-status-row"><strong>轮播状态：</strong>未启动</div>
      </div>
      <div class="toolbar-note" id="scanStatus">可直接在前端选择本地“现场演示”目录。选择后会按腾讯文档清单匹配素材并刷新目录。</div>
    </div>
  </div>

  <input id="directoryInput" type="file" webkitdirectory directory multiple hidden>

  <script>

    function normalizePath(path) {
      return String(path || "").replace(/\\/g, "/").replace(/^\.?\//, "");
    }

    function normalizeSelectedRelativePath(path) {
      const normalized = normalizePath(path);
      if (!normalized) {
        return "";
      }

      const segments = normalized.split("/").filter(Boolean);
      if (!segments.length) {
        return "";
      }

      const anchorIndex = segments.findIndex((segment) => {
        if (segment === "机房") {
          return true;
        }

        if (/^指标\d+\.\d+$/.test(segment)) {
          return true;
        }

        return segment.includes("平台首页");
      });

      if (anchorIndex >= 0) {
        return segments.slice(anchorIndex).join("/");
      }

      return normalized;
    }

    function getFileName(path) {
      return normalizePath(path).split("/").pop() || "";
    }

    function getFileTitle(path) {
      return getFileName(path).replace(/\.[^.]+$/, "");
    }

    function getFileExtension(path) {
      const fileName = getFileName(path);
      const dotIndex = fileName.lastIndexOf(".");
      return dotIndex >= 0 ? fileName.slice(dotIndex + 1).toLowerCase() : "";
    }

    function inferType(path) {
      const extension = getFileExtension(path);
      if (supportedVideoExtensions.has(extension)) return "video";
      if (supportedImageExtensions.has(extension)) return "image";
      return null;
    }

    function naturalCompare(left, right) {
      return String(left || "").localeCompare(String(right || ""), "zh-Hans-CN", {
        numeric: true,
        sensitivity: "base"
      });
    }

    function getTypeLabel(type) {
      if (type === "video") return "视频";
      if (type === "image") return "图片";
      return "占位";
    }

    function toEntryObject(value) {
      if (typeof value === "string") {
        return {
          relativePath: normalizePath(value),
          title: getFileTitle(value),
          type: inferType(value),
          handle: null
        };
      }

      return {
        relativePath: normalizePath(value.relativePath || value.path),
        title: value.title || getFileTitle(value.relativePath || value.path),
        type: value.type || inferType(value.relativePath || value.path),
        handle: value.handle || null,
        file: value.file || null
      };
    }

    function uniqueAssets(assets) {
      const seen = new Set();
      return assets.filter((asset) => {
        const key = asset.relativePath || asset.title;
        if (seen.has(key)) {
          return false;
        }
        seen.add(key);
        return true;
      });
    }

    function sortAssets(assets) {
      return [...assets].sort((left, right) => naturalCompare(left.relativePath, right.relativePath));
    }

    function entryMatchesCandidate(entry, candidate) {
      const relativePath = normalizePath(entry.relativePath);
      const lowerPath = relativePath.toLowerCase();

      if (candidate.pathPrefix && !relativePath.startsWith(candidate.pathPrefix)) {
        return false;
      }

      if (candidate.includes && !candidate.includes.every((token) => lowerPath.includes(String(token).toLowerCase()))) {
        return false;
      }

      if (candidate.excludes && candidate.excludes.some((token) => lowerPath.includes(String(token).toLowerCase()))) {
        return false;
      }

      return true;
    }

    function resolveAssetsForBlueprint(blueprint, entries, resolvedItems) {
      if (blueprint.sharedFrom) {
        const sharedItem = resolvedItems.get(blueprint.sharedFrom);
        return sharedItem ? sharedItem.assets : [];
      }

      if (!blueprint.matcher) {
        return [];
      }

      if (blueprint.matcher.mode === "multi") {
        const matchedAssets = [];
        const prefixes = blueprint.matcher.folderPrefixes || [];

        prefixes.forEach((prefix) => {
          entries.forEach((entry) => {
            if (normalizePath(entry.relativePath).startsWith(prefix)) {
              matchedAssets.push(entry);
            }
          });
        });

        return sortAssets(uniqueAssets(matchedAssets));
      }

      const candidates = blueprint.matcher.candidates || [];
      for (const candidate of candidates) {
        const matches = sortAssets(entries.filter((entry) => entryMatchesCandidate(entry, candidate)));
        if (matches.length) {
          return [matches[0]];
        }
      }

      return [];
    }

    function buildItemMeta(item) {
      const pieces = [item.place].filter(Boolean);
      if (item.assets.length > 1) {
        pieces.push(`${item.assets.length} 个素材`);
      }
      return pieces.join(" · ");
    }

    function buildPlayerMeta(item) {
      const pieces = [item.sectionSubtitle, item.place].filter(Boolean);
      return pieces.join(" · ") || "请选择左侧目录项";
    }

    function createPlaceholderText(item) {
      const base = item.assets.length ? "当前素材不可播放。" : "当前条目尚未匹配到素材。";
      return `${base} 后续可点击“自动重新扫描目录”刷新。`;
    }

    function getBoothKeyForSection(section) {
      if (!section) {
        return "booth-unknown";
      }

      if (section.id === "sec-home") {
        return "booth-home";
      }

      if (section.id === "sec-room") {

      const match = String(section.title || "").match(/^展台\s*(\d+)/);
      if (match) {
        return `booth-${match[1]}`;
      }

      return `booth-${section.id}`;
    }

      const entries = rawEntries
        .map(toEntryObject)
        .filter((entry) => entry.type)
        .sort((left, right) => naturalCompare(left.relativePath, right.relativePath));

      const resolvedItems = new Map();
      const sectionStore = new Map(
        sectionBlueprints.map((section) => [section.id, { ...section, items: [] }])
      );

      itemBlueprints.forEach((blueprint) => {
        const section = sectionStore.get(blueprint.sectionId);
        const assets = resolveAssetsForBlueprint(blueprint, entries, resolvedItems);
        const item = {
          ...blueprint,
          sectionTitle: section.title,
          sectionSubtitle: section.subtitle,
          assets,
          highlighted: highlightedItemIds.has(blueprint.id)
        };
        resolvedItems.set(item.id, item);
        if (!blueprint.hidden) {
          section.items.push(item);
        }
      });

      return sectionBlueprints.map((section) => sectionStore.get(section.id));
    }

    function rebuildState(nextSections) {
      sections = nextSections;
      sectionMap = new Map(sections.map((section) => [section.id, section]));
      itemMap = new Map();
      const boothOrder = [];
      const boothStore = new Map();

      sections.forEach((section, sectionIndex) => {
        const boothKey = getBoothKeyForSection(section);
        if (!boothStore.has(boothKey)) {
          boothStore.set(boothKey, []);
          boothOrder.push(boothKey);
        }

        section.items.forEach((item, itemIndex) => {
          item.order = sectionIndex * 100 + itemIndex;
          itemMap.set(item.id, item);
          boothStore.get(boothKey).push(item.id);
        });
      });

      boothQueueMap = new Map(boothOrder.map((boothKey) => [boothKey, boothStore.get(boothKey)]));

      metricQueue = sections
        .filter((section) => section.group === "metric")
        .flatMap((section) => section.items.map((item) => item.id));

      allQueue = sections.flatMap((section) => section.items.map((item) => item.id));
    }

    function getCurrentItem() {
      return currentItemId ? itemMap.get(currentItemId) : null;
    }

    function getActiveAsset(item = getCurrentItem()) {
      if (!item || !item.assets.length) {
        return null;
      }

      return item.assets[Math.min(currentAssetIndex, item.assets.length - 1)];
    }

    function clearAutoAdvanceTimer() {
      if (autoAdvanceTimer !== null) {
        window.clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = null;
      }
    }

    function releaseCurrentObjectUrl() {
      // Media source lifecycle is managed by mediaSourceCache and clearObjectUrlCache.
    }

    function clearObjectUrlCache() {
      videoPreloadElementCache.forEach((video) => {
        video.pause();
        video.removeAttribute("src");
        video.load();
        if (video.parentNode) {
          video.parentNode.removeChild(video);
        }
      });
      videoPreloadElementCache.clear();
      imagePreloadCache.clear();

      mediaSourceCache.forEach((url) => {
        if (typeof url === "string" && url.startsWith("blob:")) {
          URL.revokeObjectURL(url);
        }
      });
      mediaSourceCache.clear();
      assetLoadPromiseCache.clear();
      assetWarmPromiseCache.clear();
    }

    function getAssetCacheKey(asset) {
      return normalizePath(asset.relativePath || asset.title || "");
    }

    function setVisibility(target) {
      videoEl.style.display = target === "video" ? "block" : "none";
      imageEl.style.display = target === "image" ? "block" : "none";
      placeholderEl.style.display = target === "placeholder" ? "grid" : "none";
    }

    function updateActiveState() {
      document.querySelectorAll(".item-button").forEach((button) => {
        button.classList.toggle("active", button.dataset.itemId === currentItemId);
      });
    }

    function updateFilterButtonState() {
      const mappings = [
        ["filterAllBtn", "all"],
        ["filterBoothBtn", "booth"],
        ["filterMetricBtn", "metric"]
      ];

      mappings.forEach(([id, mode]) => {
        const button = document.getElementById(id);
        if (!button) {
          return;
        }
        button.classList.toggle("active-filter", catalogFilterMode === mode);
      });
    }

    function scrollActiveItemIntoView() {
      if (!currentItemId) {
        return;
      }

      const activeButton = catalogEl.querySelector(`.item-button[data-item-id="${currentItemId}"]`);
      if (!activeButton) {
        return;
      }

      activeButton.scrollIntoView({
        behavior: "smooth",
        block: "center",
        inline: "nearest"
      });
    }

    function updateQueueInfo() {
      const activeItem = getCurrentItem();
      const assetLabel = activeItem && activeItem.assets.length > 1
        ? ` · 素材 ${currentAssetIndex + 1}/${activeItem.assets.length}`
        : "";

      modeInfoEl.innerHTML = `<strong>当前模式：</strong>${currentModeLabel} · <strong>素材来源：</strong>${getSourceModeLabel()}`;

      if (!currentQueue.length) {
        queueInfoEl.innerHTML = activeItem
          ? `<strong>轮播状态：</strong>单项预览 · 当前项：${activeItem.title}${assetLabel}`
          : "<strong>轮播状态：</strong>未启动";
        return;
      }

      const loopText = loopToggleEl.checked ? "开启循环" : "单轮播放";
      const currentNumber = currentQueueIndex + 1;
      const queueSize = currentQueue.length;
      const activeTitle = activeItem ? activeItem.title : "未选择";
      queueInfoEl.innerHTML = `<strong>轮播状态：</strong>${currentNumber} / ${queueSize} · ${loopText} · 当前项：${activeTitle}${assetLabel}`;
    }

    function scheduleAutoAdvance(item) {
      clearAutoAdvanceTimer();
      if (!currentQueue.length || currentModeLabel === "单项预览") {
        return;
      }

      const asset = getActiveAsset(item);
      if (!asset || asset.type === "image") {
        autoAdvanceTimer = window.setTimeout(() => {
          playNext(true);
        }, placeholderDurationMs);
      }
    }

    function resetVideoElement() {
      activeClipRange = null;
      clipRangeHandled = false;
      videoEl.pause();
      videoEl.removeAttribute("src");
      videoEl.src = "";
      videoEl.load();
    }

    function getItemClipRange(item) {
      if (!item) {
        return null;
      }

      const hasClipStart = Number.isFinite(item.clipStartSeconds);
      const hasClipEnd = Number.isFinite(item.clipEndSeconds);
      if (!hasClipStart && !hasClipEnd) {
        return null;
      }

      return {
        start: hasClipStart ? item.clipStartSeconds : 0,
        end: hasClipEnd ? item.clipEndSeconds : null
      };
    }

    function getSourceModeLabel(mode = currentSourceMode) {
      return mode === "local" ? "本地视频" : "云端视频";
    }

    function syncSourceModeControl() {
      sourceModeToggleEl.checked = currentSourceMode === "local";
      sourceModeLabelEl.textContent = currentSourceMode === "local" ? "使用本地视频" : "使用云端视频";
      modeInfoEl.innerHTML = `<strong>当前模式：</strong>${currentModeLabel} · <strong>素材来源：</strong>${getSourceModeLabel()}`;
    }

    function getSourceAwareAssetKey(asset, mode = currentSourceMode) {
      return `${mode}:${normalizePath(asset.relativePath || asset.title || "")}`;
    }

    function trimVideoPreloadCache() {
      while (videoPreloadElementCache.size > maxVideoPreloadCount) {
        const firstKey = videoPreloadElementCache.keys().next().value;
        const evictedVideo = videoPreloadElementCache.get(firstKey);
        if (evictedVideo) {
          evictedVideo.pause();
          evictedVideo.removeAttribute("src");
          evictedVideo.load();
          if (evictedVideo.parentNode) {
            evictedVideo.parentNode.removeChild(evictedVideo);
          }
        }
        videoPreloadElementCache.delete(firstKey);
      }
    }

    function primeVideoPipeline(cacheKey, sourceUrl) {
      let preloadVideo = videoPreloadElementCache.get(cacheKey);

      if (!preloadVideo) {
        preloadVideo = document.createElement("video");
        preloadVideo.preload = "auto";
        preloadVideo.muted = true;
        preloadVideo.playsInline = true;
        preloadVideo.style.display = "none";
        document.body.appendChild(preloadVideo);
      }

      if (preloadVideo.dataset.src !== sourceUrl) {
        preloadVideo.dataset.src = sourceUrl;
        preloadVideo.src = sourceUrl;
        preloadVideo.load();
      }

      videoPreloadElementCache.delete(cacheKey);
      videoPreloadElementCache.set(cacheKey, preloadVideo);
      trimVideoPreloadCache();
    }

    async function primeAssetForPlayback(asset) {
      const sourceUrl = await resolveMediaSource(asset);
      const cacheKey = getSourceAwareAssetKey(asset);

      if (asset.type === "video") {
        primeVideoPipeline(cacheKey, sourceUrl);
        return;
      }

      if (asset.type === "image") {
        if (imagePreloadCache.has(cacheKey)) {
          return;
        }
        const preloadImage = new Image();
        preloadImage.src = sourceUrl;
        imagePreloadCache.set(cacheKey, preloadImage);
      }
    }

    function warmHttpAssetCache(asset, sourceUrl) {
      if (!asset || asset.file || asset.handle) {
        return;
      }

      const cacheKey = getSourceAwareAssetKey(asset, "cloud");
      if (assetWarmPromiseCache.has(cacheKey)) {
        return;
      }

      const pending = fetch(sourceUrl, { cache: "force-cache" })
        .then((response) => {
          if (!response.ok) {
            throw new Error(`素材缓存预热失败: ${response.status}`);
          }
        })
        .catch(() => {
          // Ignore warm-up failures to avoid interrupting playback.
        })
        .finally(() => {
          assetWarmPromiseCache.delete(cacheKey);
        });

      assetWarmPromiseCache.set(cacheKey, pending);
    }

    async function resolveMediaSource(asset) {
      const cacheKey = getSourceAwareAssetKey(asset);

      if (mediaSourceCache.has(cacheKey)) {
        return mediaSourceCache.get(cacheKey);
      }

      if (assetLoadPromiseCache.has(cacheKey)) {
        return assetLoadPromiseCache.get(cacheKey);
      }

      const pending = (async () => {
        let sourceUrl;
        const localAsset = currentSourceMode === "local" ? localAssetMap.get(normalizePath(asset.relativePath || asset.title || "")) : null;

        if (localAsset && localAsset.file) {
          sourceUrl = URL.createObjectURL(localAsset.file);
        } else if (localAsset && localAsset.handle) {
          const file = await localAsset.handle.getFile();
          sourceUrl = URL.createObjectURL(file);
        } else if (asset.file) {
          sourceUrl = URL.createObjectURL(asset.file);
        } else if (asset.handle) {
          const file = await asset.handle.getFile();
          sourceUrl = URL.createObjectURL(file);
        } else {
          sourceUrl = encodeURI(asset.relativePath);
          warmHttpAssetCache(asset, sourceUrl);
        }

        mediaSourceCache.set(cacheKey, sourceUrl);
        return sourceUrl;
      })().finally(() => {
        assetLoadPromiseCache.delete(cacheKey);
      });

      assetLoadPromiseCache.set(cacheKey, pending);
      return pending;
    }

    function getUpcomingAssets(limit = 2) {
      const upcoming = [];
      const activeItem = getCurrentItem();
      if (!activeItem) {
        return upcoming;
      }

      for (let index = currentAssetIndex + 1; index < activeItem.assets.length && upcoming.length < limit; index += 1) {
        upcoming.push(activeItem.assets[index]);
      }

      if (upcoming.length >= limit) {
        return upcoming;
      }

      const baseQueue = currentQueue.length ? currentQueue : getCurrentSectionQueue();
      if (!baseQueue.length || !currentItemId) {
        return upcoming;
      }

      const queueIndex = baseQueue.indexOf(currentItemId);
      if (queueIndex < 0) {
        return upcoming;
      }

      let cursor = queueIndex + 1;
      while (upcoming.length < limit) {
        if (cursor >= baseQueue.length) {
          if (!currentQueue.length || !loopToggleEl.checked) {
            break;
          }
          cursor = 0;
        }

        if (cursor === queueIndex) {
          break;
        }

        const nextItem = itemMap.get(baseQueue[cursor]);
        if (nextItem && nextItem.assets.length) {
          upcoming.push(nextItem.assets[0]);
        }

        cursor += 1;
      }

      return upcoming;
    }

    function preloadUpcomingAssets(limit = 2) {
      const upcomingAssets = getUpcomingAssets(limit);
      upcomingAssets.forEach((asset) => {
        primeAssetForPlayback(asset).catch(() => {});
      });
    }

    function handleMediaLoadError(item) {
      setVisibility("placeholder");
      videoEl.pause();
      videoEl.removeAttribute("src");
      videoEl.load();
      imageEl.removeAttribute("src");
      placeholderTitleEl.textContent = item.title;
      placeholderDescEl.textContent = "当前素材加载失败，请稍后重试或检查文件路径。";
      mediaPathEl.textContent = `${buildPlayerMeta(item)} · 当前素材暂不可播放`;
      updateQueueInfo();

      if (currentQueue.length) {
        clearAutoAdvanceTimer();
        autoAdvanceTimer = window.setTimeout(() => {
          playNext(true);
        }, 1500);
      }
    }

    async function showItem(item, autoplay, assetIndex = 0) {
      if (!item) {
        return;
      }

      const previousItemId = currentItemId;
      clearAutoAdvanceTimer();
      releaseCurrentObjectUrl();
      const renderToken = ++activeRenderToken;

      currentItemId = item.id;
      currentAssetIndex = Math.max(0, Math.min(assetIndex, Math.max(item.assets.length - 1, 0)));

      if (catalogFilterMode !== "all" && previousItemId !== currentItemId) {
        renderCatalog();
      }

      const activeAsset = getActiveAsset(item);
      const badgeSuffix = item.assets.length > 1 ? ` ${currentAssetIndex + 1}/${item.assets.length}` : "";

      mediaBadgeEl.textContent = `${getTypeLabel(activeAsset ? activeAsset.type : "placeholder")}${badgeSuffix} · ${item.sectionTitle}`;
      mediaTitleEl.textContent = item.title;
      mediaPathEl.textContent = buildPlayerMeta(item);

      if (!activeAsset) {
        setVisibility("placeholder");
        resetVideoElement();
        imageEl.removeAttribute("src");
        placeholderTitleEl.textContent = item.title;
        placeholderDescEl.textContent = createPlaceholderText(item);
        updateActiveState();
        if (previousItemId !== currentItemId) {
          scrollActiveItemIntoView();
        }
        updateQueueInfo();
        scheduleAutoAdvance(item);
        return;
      }

      if (activeAsset.type === "video") {
        setVisibility("video");
        imageEl.removeAttribute("src");
        placeholderTitleEl.textContent = "待补充素材";
        placeholderDescEl.textContent = "";
        resetVideoElement();
        activeClipRange = getItemClipRange(item);
        clipRangeHandled = false;
        let src;
        try {
          src = await resolveMediaSource(activeAsset);
        } catch (error) {
          if (renderToken !== activeRenderToken) {
            return;
          }
          handleMediaLoadError(item);
          return;
        }
        if (renderToken !== activeRenderToken) {
          releaseCurrentObjectUrl();
          return;
        }
        videoEl.src = src;
        videoEl.load();
        const applyClipAndAutoplay = () => {
          if (renderToken !== activeRenderToken) {
            return;
          }

          if (activeClipRange && Number.isFinite(activeClipRange.start) && videoEl.duration) {
            const safeStart = Math.min(activeClipRange.start, Math.max(videoEl.duration - 0.1, 0));
            if (Math.abs(videoEl.currentTime - safeStart) > 0.2) {
              videoEl.currentTime = safeStart;
            }
          }

          if (autoplay) {
            videoEl.play().catch(() => {
              mediaPathEl.textContent = `${buildPlayerMeta(item)} · 浏览器拦截了自动播放，请手动点击播放`;
            });
          }
        };

        if (videoEl.readyState >= 1) {
          applyClipAndAutoplay();
        } else {
          videoEl.addEventListener("loadedmetadata", applyClipAndAutoplay, { once: true });
        }
      } else {
        setVisibility("image");
        resetVideoElement();
        let src;
        try {
          src = await resolveMediaSource(activeAsset);
        } catch (error) {
          if (renderToken !== activeRenderToken) {
            return;
          }
          handleMediaLoadError(item);
          return;
        }
        if (renderToken !== activeRenderToken) {
          releaseCurrentObjectUrl();
          return;
        }
        imageEl.src = src;
      }

      updateActiveState();
      if (previousItemId !== currentItemId) {
        scrollActiveItemIntoView();
      }
      updateQueueInfo();
      scheduleAutoAdvance(item);
      preloadUpcomingAssets(4);
    }

    function startQueue(queue, modeLabel, preferredItemId) {
      if (!queue.length) {
        return;
      }

      currentQueue = [...queue];
      currentModeLabel = modeLabel;

      const preferredIndex = preferredItemId ? currentQueue.indexOf(preferredItemId) : -1;
      currentQueueIndex = preferredIndex >= 0 ? preferredIndex : 0;

      const item = itemMap.get(currentQueue[currentQueueIndex]);
      showItem(item, true, 0);
    }

    function stopQueue() {
      clearAutoAdvanceTimer();
      currentQueue = [];
      currentQueueIndex = -1;
      currentModeLabel = "单项预览";
      updateQueueInfo();
    }

    function playSingle(itemId) {
      stopQueue();
      const item = itemMap.get(itemId);
      showItem(item, false, 0);
    }

    function getCurrentSectionQueue() {
      if (!currentItemId) {
        const firstSection = sections[0];
        return firstSection ? firstSection.items.map((item) => item.id) : [];
      }

      const activeItem = itemMap.get(currentItemId);
      const section = sectionMap.get(activeItem.sectionId);
      return section ? section.items.map((item) => item.id) : [];
    }

    function getCurrentBoothQueue() {
      if (!currentItemId) {
        const firstBooth = boothQueueMap.values().next().value;
        return firstBooth || [];
      }

      const activeItem = itemMap.get(currentItemId);
      if (!activeItem) {
        const firstBooth = boothQueueMap.values().next().value;
        return firstBooth || [];
      }

      const section = sectionMap.get(activeItem.sectionId);
      const boothKey = getBoothKeyForSection(section);
      return boothQueueMap.get(boothKey) || [];
    }

    function getFilteredSections() {
      if (catalogFilterMode === "all") {
        return sections;
      }

      const activeItem = getCurrentItem();
      if (!activeItem) {
        return sections;
      }

      if (catalogFilterMode === "booth") {
        const activeSection = sectionMap.get(activeItem.sectionId);
        const activeBoothKey = getBoothKeyForSection(activeSection);
        return sections
          .map((section) => ({
            ...section,
            items: section.items.filter(() => getBoothKeyForSection(section) === activeBoothKey)
          }))
          .filter((section) => section.items.length > 0);
      }

      if (catalogFilterMode === "metric") {
        const activeSection = sectionMap.get(activeItem.sectionId);
        if (!activeSection || activeSection.group !== "metric") {
          return [];
        }

        return sections
          .map((section) => ({
            ...section,
            items: section.id === activeSection.id ? section.items : []
          }))
          .filter((section) => section.items.length > 0);
      }

      return sections;
    }

    function applyCatalogFilter(mode) {
      catalogFilterMode = mode;
      renderCatalog();
      updateActiveState();
      updateFilterButtonState();
      scrollActiveItemIntoView();
    }

    function tryAdvanceWithinItem(offset, autoplay) {
      const item = getCurrentItem();
      if (!item || item.assets.length <= 1) {
        return false;
      }

      const nextAssetIndex = currentAssetIndex + offset;
      if (nextAssetIndex < 0 || nextAssetIndex >= item.assets.length) {
        return false;
      }

      showItem(item, autoplay, nextAssetIndex);
      return true;
    }

    function stepInQueue(offset) {
      const baseQueue = currentQueue.length ? currentQueue : getCurrentSectionQueue();
      if (!baseQueue.length) {
        return;
      }

      const currentIndex = currentItemId ? baseQueue.indexOf(currentItemId) : -1;
      const safeIndex = currentIndex >= 0 ? currentIndex : 0;
      let nextIndex = safeIndex + offset;

      if (nextIndex < 0) {
        nextIndex = baseQueue.length - 1;
      } else if (nextIndex >= baseQueue.length) {
        nextIndex = 0;
      }

      if (currentQueue.length) {
        currentQueueIndex = nextIndex;
        showItem(itemMap.get(baseQueue[nextIndex]), true, 0);
      } else {
        showItem(itemMap.get(baseQueue[nextIndex]), false, 0);
      }
    }

    function playNext(fromAutoAdvance) {
      if (tryAdvanceWithinItem(1, true)) {
        return;
      }

      if (!currentQueue.length) {
        stepInQueue(1);
        return;
      }

      let nextIndex = currentQueueIndex + 1;
      if (nextIndex >= currentQueue.length) {
        if (!loopToggleEl.checked) {
          if (fromAutoAdvance) {
            currentModeLabel = "单轮播放结束";
            updateQueueInfo();
          }
          clearAutoAdvanceTimer();
          return;
        }
        nextIndex = 0;
      }

      currentQueueIndex = nextIndex;
      showItem(itemMap.get(currentQueue[currentQueueIndex]), true, 0);
    }

    function playPrev() {
      if (tryAdvanceWithinItem(-1, currentQueue.length > 0)) {
        return;
      }

      if (!currentQueue.length) {
        stepInQueue(-1);
        return;
      }

      currentQueueIndex = currentQueueIndex <= 0 ? currentQueue.length - 1 : currentQueueIndex - 1;
      showItem(itemMap.get(currentQueue[currentQueueIndex]), true, 0);
    }

    function renderCatalog() {
      const fragment = document.createDocumentFragment();
      const visibleSections = getFilteredSections();

      visibleSections.forEach((section) => {
        const sectionEl = document.createElement("section");
        sectionEl.className = "section";

        const headerEl = document.createElement("div");
        headerEl.className = "section-header";
        headerEl.innerHTML = `
          <div class="section-heading">
            <h3>${section.title}</h3>
            <div class="section-subtitle">${section.subtitle}</div>
          </div>
          <div class="section-count">${section.items.length}</div>
        `;

        const listEl = document.createElement("div");
        listEl.className = "item-list";

        section.items.forEach((item) => {
          const itemButton = document.createElement("button");
          itemButton.className = `item-button${item.highlighted ? " highlighted" : ""}`;
          itemButton.dataset.itemId = item.id;
          const meta = buildItemMeta(item);
          itemButton.innerHTML = `
            <div class="item-title-row">
              <div class="item-title">${item.title}</div>
              ${item.highlighted ? '<span class="item-badge">推荐</span>' : ""}
            </div>
            ${meta ? `<div class="item-meta">${meta}</div>` : ""}
          `;
          itemButton.addEventListener("click", () => {
            playSingle(item.id);
          });
          listEl.appendChild(itemButton);
        });

        sectionEl.appendChild(headerEl);
        sectionEl.appendChild(listEl);
        fragment.appendChild(sectionEl);
      });

      catalogEl.replaceChildren(fragment);
      updateFilterButtonState();
    }

    function buildInitialCatalog() {
      rebuildState(buildSectionsFromEntries(initialEntries));
      renderCatalog();
      syncSourceModeControl();
    }

    async function collectEntries(directoryHandle, parentSegments = []) {
      const entries = [];

      for await (const handle of directoryHandle.values()) {
        if (handle.name.startsWith(".")) {
          continue;
        }

        if (handle.kind === "directory") {
          const nestedEntries = await collectEntries(handle, [...parentSegments, handle.name]);
          entries.push(...nestedEntries);
          continue;
        }

        if (handle.name === "index.html") {
          continue;
        }

        const relativePath = normalizeSelectedRelativePath([...parentSegments, handle.name].join("/"));
        const type = inferType(relativePath);
        if (!type) {
          continue;
        }

        entries.push({
          relativePath,
          title: getFileTitle(relativePath),
          type,
          handle
        });
      }

      return entries;
    }

    function collectEntriesFromFileList(fileList) {
      const entries = [];

      Array.from(fileList).forEach((file) => {
        const rawPath = normalizePath(file.webkitRelativePath || file.name);
        if (!rawPath || getFileName(rawPath).startsWith(".")) {
          return;
        }

        const relativePath = normalizeSelectedRelativePath(rawPath);
        if (!relativePath || getFileName(relativePath) === "index.html") {
          return;
        }

        const type = inferType(relativePath);
        if (!type) {
          return;
        }

        entries.push({
          relativePath,
          title: getFileTitle(relativePath),
          type,
          file
        });
      });

      return entries;
    }

    function applyEntries(entries, successMessage) {
      stopQueue();
      releaseCurrentObjectUrl();
      clearObjectUrlCache();
      localAssetMap = new Map(entries.map((entry) => [normalizePath(entry.relativePath || entry.title || ""), entry]));
      rebuildState(buildSectionsFromEntries([...initialEntries, ...entries]));
      renderCatalog();
      currentSourceMode = "local";
      currentItemId = null;
      currentAssetIndex = 0;
      syncSourceModeControl();
      updateActiveState();
      updateQueueInfo();
      setScanStatus(successMessage);

      const preferredItemId = allQueue.includes("item-home") ? "item-home" : allQueue[0];
      if (preferredItemId) {
        showItem(itemMap.get(preferredItemId), false, 0);
      }
    }

    async function scanDirectoryWithPicker() {
      if (!window.showDirectoryPicker) {
        setScanStatus("当前浏览器不支持目录选择，请改用 Chrome、Edge 或 Safari。");
        return;
      }

      try {
        setScanStatus("正在读取本地目录，请稍候...");
        const directoryHandle = await window.showDirectoryPicker({ mode: "read" });
        const entries = await collectEntries(directoryHandle);
        applyEntries(entries, `本地目录已加载：识别到 ${entries.length} 个素材，目录已按腾讯文档清单刷新。`);
      } catch (error) {
        if (error && error.name === "AbortError") {
          setScanStatus("已取消选择本地目录。当前目录列表保持不变。");
          return;
        }
        setScanStatus(`读取本地目录失败：${error.message || "请重试"}`);
      }
    }

    function openDirectoryInput() {
      directoryInputEl.value = "";
      directoryInputEl.click();
    }

    function chooseLocalDirectory() {
      const supportsDirectoryInput = directoryInputEl.webkitdirectory !== undefined || directoryInputEl.directory !== undefined;
      if (supportsDirectoryInput) {
        openDirectoryInput();
        return;
      }

      scanDirectoryWithPicker();
    }

    function openSettingsModal() {
      settingsModalEl.classList.add("open");
    }

    function closeSettingsModal() {
      settingsModalEl.classList.remove("open");
    }

    document.getElementById("playSectionBtn").addEventListener("click", () => {
      const queue = getCurrentSectionQueue();
      startQueue(queue, "当前目录轮播", currentItemId);
    });

    document.getElementById("playBoothBtn").addEventListener("click", () => {
      const queue = getCurrentBoothQueue();
      const preferredItem = currentItemId && queue.includes(currentItemId) ? currentItemId : queue[0];
      startQueue(queue, "同展台轮播", preferredItem);
    });

    document.getElementById("playMetricsBtn").addEventListener("click", () => {
      const preferredItem = currentItemId && metricQueue.includes(currentItemId) ? currentItemId : metricQueue[0];
      startQueue(metricQueue, "按指标顺序轮播", preferredItem);
    });

    document.getElementById("playAllBtn").addEventListener("click", () => {
      const preferredItem = currentItemId && allQueue.includes(currentItemId) ? currentItemId : allQueue[0];
      startQueue(allQueue, "全素材轮播", preferredItem);
    });

    document.getElementById("stopBtn").addEventListener("click", () => {
      stopQueue();
    });

    document.getElementById("scanBtn").addEventListener("click", () => {
      chooseLocalDirectory();
    });

    sourceModeToggleEl.addEventListener("change", () => {
      currentSourceMode = sourceModeToggleEl.checked ? "local" : "cloud";
      syncSourceModeControl();
      clearObjectUrlCache();

      const activeItem = getCurrentItem() || itemMap.get(currentItemId) || itemMap.get(allQueue[0]);
      if (activeItem) {
        showItem(activeItem, currentQueue.length > 0, currentAssetIndex);
      }

      setScanStatus(currentSourceMode === "local"
        ? "已切换为本地视频源，优先使用上传素材。"
        : "已切换为云端视频源。");
    });

    settingsBtnEl.addEventListener("click", () => {
      openSettingsModal();
    });

    if (fullscreenBtnEl) {
      fullscreenBtnEl.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      document.addEventListener("fullscreenchange", () => {
        if (document.fullscreenElement) {
          fullscreenBtnEl.title = "退出全屏";
        } else {
          fullscreenBtnEl.title = "全屏";
        }
      });
    }

    closeSettingsBtnEl.addEventListener("click", () => {
      closeSettingsModal();
    });

    settingsModalEl.addEventListener("click", (event) => {
      if (event.target === settingsModalEl) {
        closeSettingsModal();
      }
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeSettingsModal();
      }
    });

    directoryInputEl.addEventListener("change", (event) => {
      const files = event.target.files;
      if (!files || !files.length) {
        setScanStatus("未选择本地目录。当前目录列表保持不变。");
        return;
      }

      const entries = collectEntriesFromFileList(files);
      applyEntries(entries, `本地目录已加载：识别到 ${entries.length} 个素材，目录已按腾讯文档清单刷新。`);
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      playPrev();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      playNext(false);
    });

    document.getElementById("replayBtn").addEventListener("click", () => {
      const item = getCurrentItem();
      if (!item) {
        return;
      }

      const asset = getActiveAsset(item);
      if (asset && asset.type === "video") {
        clipRangeHandled = false;
        videoEl.currentTime = activeClipRange && Number.isFinite(activeClipRange.start) ? activeClipRange.start : 0;
        videoEl.play().catch(() => {});
      } else {
        showItem(item, false, currentAssetIndex);
      }
    });

    document.getElementById("openCurrentSectionBtn").addEventListener("click", () => {
      const queue = getCurrentSectionQueue();
      startQueue(queue, "当前目录轮播", currentItemId);
    });

    loopToggleEl.addEventListener("change", () => {
      updateQueueInfo();
    });

    document.getElementById("filterAllBtn").addEventListener("click", () => {
      applyCatalogFilter("all");
    });

    document.getElementById("filterBoothBtn").addEventListener("click", () => {
      if (!getCurrentItem()) {
        window.alert("未选择视频，无法点击本按钮。");
        return;
      }
      applyCatalogFilter("booth");
    });

    document.getElementById("filterMetricBtn").addEventListener("click", () => {
      const activeItem = getCurrentItem();
      const activeSection = activeItem ? sectionMap.get(activeItem.sectionId) : null;
      if (!activeItem || !activeSection || activeSection.group !== "metric") {
        window.alert("当前未选择指标条目，无法仅显示当前指标条目。");
        return;
      }
      applyCatalogFilter("metric");
    });

    videoEl.addEventListener("ended", () => {
      playNext(true);
    });

    videoEl.addEventListener("timeupdate", () => {
      if (!activeClipRange || !Number.isFinite(activeClipRange.end) || clipRangeHandled) {
        return;
      }

      if (videoEl.currentTime >= activeClipRange.end - 0.15) {
        clipRangeHandled = true;
        if (currentQueue.length) {
          playNext(true);
          return;
        }

        videoEl.pause();
        videoEl.currentTime = activeClipRange.end;
      }
    });

    videoEl.addEventListener("error", () => {
      const item = getCurrentItem();
      if (item) {
        mediaPathEl.textContent = `${buildPlayerMeta(item)} · 当前素材暂不可播放`;
        clearAutoAdvanceTimer();
        if (currentQueue.length) {
          autoAdvanceTimer = window.setTimeout(() => {
            playNext(true);
          }, 1500);
        }
      }
    });

    window.addEventListener("beforeunload", () => {
      clearObjectUrlCache();
    });

    async function initializePlaybackOnLoad() {
      buildInitialCatalog();
      updateQueueInfo();
      syncSourceModeControl();

      const homeItem = itemMap.get("item-home");
      if (homeItem && homeItem.assets.length) {
        try {
          await resolveMediaSource(homeItem.assets[0]);
        } catch (error) {
          // Ignore preload failures and continue with default playback mode.
        }
      }

      const preferredItemId = allQueue.includes("item-home") ? "item-home" : allQueue[0];
      if (preferredItemId) {
        startQueue(allQueue, "全素材轮播", preferredItemId);
      }
    }

    initializePlaybackOnLoad();
  </script>
</body>
</html>
